<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Myth4Ever5 — Nền tảng web game party chơi cùng bạn bè thời gian thực">
    <title>Myth4Ever5 — Party Game Lounge</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/mythic-cards.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="logo-brand">
            <div class="logo-glyph">♟</div>
            <span class="logo-name">MYTH4EVER5</span>
            <span class="logo-sub">Party Lounge</span>
        </div>
        <div class="status-dot" id="connection-status">Đang kết nối...</div>
        <button id="btn-leave-room" class="btn btn-ghost" style="display: none; padding: 4px 12px; font-size: 12px; border-color: var(--crimson); color: var(--crimson-bright); margin-left: auto;">
            🔙 Rời Phòng
        </button>
    </header>

    <!-- ===== MAIN ===== -->
    <main style="flex:1; display:flex; flex-direction:column;">

        <!-- VIEW 1: Lobby — Create / Join Room -->
        <section id="lobby-view" class="screen active"
                 style="justify-content:center; align-items:center; padding:32px;">

            <div class="panel lobby-wrap">
                <h2 style="margin-bottom:4px;">Chào Mừng</h2>
                <p>Chọn avatar, nhập tên rồi tạo hoặc tham gia phòng chơi.</p>

                <!-- Avatar -->
                <div class="field-group" style="margin-bottom:16px;">
                    <span class="field-label">Avatar</span>
                    <div class="avatar-grid">
                        <div class="avatar-option active" title="Pháp Sư">🧙‍♂️</div>
                        <div class="avatar-option" title="Ninja">🥷</div>
                        <div class="avatar-option" title="Nữ Anh Hùng">🦸‍♀️</div>
                        <div class="avatar-option" title="Máy">🤖</div>
                        <div class="avatar-option" title="Hồ Li">🦊</div>
                        <div class="avatar-option" title="Rồng">🐲</div>
                        <div class="avatar-option" title="Kỳ Lân">🦄</div>
                        <div class="avatar-option" title="Vương">👑</div>
                    </div>
                </div>

                <!-- Name -->
                <div class="field-group">
                    <label class="field-label" for="player-name-input">Tên Người Chơi</label>
                    <input type="text" id="player-name-input" class="input-field"
                           placeholder="VD: Hắc Long" maxlength="16" autocomplete="off">
                </div>

                <!-- Create -->
                <button id="btn-create-room" class="btn btn-primary" style="margin-bottom:12px;">
                    Tạo Phòng Mới
                </button>

                <div class="divider">hoặc tham gia</div>

                <!-- Join -->
                <div style="display:flex; gap:8px;">
                    <input type="text" id="room-code-input" class="input-field"
                           placeholder="Mã phòng (VD: AB3XY7)"
                           style="text-transform:uppercase; letter-spacing:0.1em; flex:1;">
                    <button id="btn-join-room" class="btn btn-ghost" style="flex-shrink:0;">
                        Vào Phòng
                    </button>
                </div>
            </div>
        </section>

        <!-- VIEW 2: Room Lobby — Waiting for players -->
        <section id="room-view" class="screen"
                 style="flex-direction:column; align-items:center; padding:32px;">

            <div class="panel" style="width:100%; max-width:520px; padding:28px;">

                <!-- Room code -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border-dim);">
                    <div>
                        <div class="caption" style="margin-bottom:4px;">Mã Phòng Chơi</div>
                        <div class="room-code-display" id="display-room-code">——————</div>
                    </div>
                    <button class="btn btn-ghost" id="btn-copy-code">
                        Sao Chép
                    </button>
                </div>

                <!-- Players -->
                <div class="caption" style="margin-bottom:12px;">
                    Người Chơi Trong Phòng
                </div>
                <div id="room-player-list" style="margin-bottom:24px;"></div>

                <!-- Start -->
                <button id="btn-start-game" class="btn btn-primary" style="font-size:15px; padding:14px;">
                    Bắt Đầu Game
                </button>
            </div>
        </section>

        <!-- VIEW 3: Game Container -->
        <section id="game-container" class="screen" style="flex-direction:column;"></section>

    </main>

    <!-- ===== CHAT BAR (footer) ===== -->
    <footer class="chat-bar">
        <!-- Emoji Strip -->
        <div class="emoji-strip">
            <button class="emoji-btn" data-emoji="💣" title="Bẫy">💣</button>
            <button class="emoji-btn" data-emoji="🛡️" title="Gỡ bẫy">🛡️</button>
            <button class="emoji-btn" data-emoji="😂" title="Cười">😂</button>
            <button class="emoji-btn" data-emoji="💀" title="GG">💀</button>
            <button class="emoji-btn" data-emoji="🔥" title="Cháy">🔥</button>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-wrap">
            <input type="text" id="chat-input" class="input-field"
                   placeholder="Nhắn gì đó với cả phòng..."
                   style="font-size:13px;">
            <button class="chat-send-btn" id="btn-send-chat">Gửi</button>
        </div>
    </footer>

    <!-- Chat Messages Floating Panel -->
    <div class="panel chat-panel" id="chat-panel">
        <div class="chat-panel-label">💬 Chat Phòng</div>
        <div class="chat-messages" id="chat-messages"></div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="js/core/signalr-service.js"></script>
    <script src="js/core/lobby-manager.js"></script>
    <script src="js/core/sound-fx.js"></script>
    <script src="js/core/game-loader.js"></script>
    <script src="js/games/mythic-cards-renderer.js"></script>

    <script>
        // Init Audio on first interaction
        document.body.addEventListener('click', () => {
            if (window.soundFX) window.soundFX.init();
        }, { once: true });
        document.addEventListener('DOMContentLoaded', async () => {
            // Copy room code button
            document.getElementById('btn-copy-code')?.addEventListener('click', () => {
                const code = document.getElementById('display-room-code').innerText;
                navigator.clipboard.writeText(code);
                window.lobbyManager.showToast('Đã sao chép mã phòng!', 'success');
            });

            // Kết nối SignalR C# Backend (Hỗ trợ cả môi trường Dev ở máy và Deploy)
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const backendUrl = isLocal 
                ? 'http://localhost:5000/hubs/party' 
                : 'https://myth4ever5-backend.onrender.com/hubs/party';

            const connected = await window.signalRService.init(backendUrl);
            const statusEl = document.getElementById('connection-status');

            if (connected) {
                statusEl.textContent = 'Online';
                statusEl.style.color = 'var(--emerald-bright)';

                window.signalRService.on('RoomStateUpdated',    (room) => window.lobbyManager.renderRoomState(room));
                window.signalRService.on('GameStarted',         (gameTypeId, data) => window.gameLoader.loadGame(gameTypeId, data));
                window.signalRService.on('GameActionBroadcast', (actionType, data) => window.gameLoader.handleAction(actionType, data));
                window.signalRService.on('GameOver',            (wId, wName, sum) => window.gameLoader.handleGameOver(wId, wName, sum));
                window.signalRService.on('ReceiveChatMessage',  (sId, sName, sAv, msg, time) => window.lobbyManager.appendChatMessage(sName, sAv, msg, time));
                window.signalRService.on('ReceiveEmojiReaction',(sId, sName, emoji) => window.lobbyManager.spawnFloatingEmoji(emoji, sName));
                window.signalRService.on('ErrorNotification',   (err) => {
                    window.lobbyManager.showToast(err, 'danger');
                    if (err === "Không tìm thấy phòng chơi!" || err === "Bạn không thuộc phòng này!") {
                        window.lobbyManager.clearRoomState();
                    }
                });

                // Tự động vào lại phòng nếu F5
                const savedRoom = localStorage.getItem('myth_room_code');
                if (savedRoom) {
                    window.signalRService.rejoinRoom(savedRoom);
                }
            } else {
                statusEl.textContent = 'Offline — Không kết nối được Server';
                statusEl.style.color = 'var(--crimson-bright)';
                window.lobbyManager.showToast('Không thể kết nối Server C#. Kiểm tra dotnet run.', 'danger');
            }
        });
    </script>
</body>
</html>
